name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O SQLite nativo precisa do binário da plataforma, mesmo que o npm pule scripts de instalação.
      - run: npm rebuild better-sqlite3
      - name: Tipos, lint e testes
        run: npm run check
      - name: Build de produção
        run: npm run build
