<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8edf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1226" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS: instalado na tela de início abre sem a barra do Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rolê" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content='Transforme "vamos marcar algo?" em rolê confirmado.' />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Operação Rolê</title>
  </head>
  <body>
    <!-- Rugosidade de tinta para o carimbo (filtro reutilizado em CSS) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="ink-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.85"
          numOctaves="2"
          seed="4"
          result="noise"
        />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" />
      </filter>
    </svg>
    <div id="root">
      <!-- Aparece só se o app não carregar (navegador antigo ou JavaScript desligado); o React troca isto ao montar. -->
      <p
        style="
          font:
            16px/1.5 system-ui,
            sans-serif;
          max-width: 28rem;
          margin: 3rem auto;
          padding: 0 1.25rem;
          color: #0e1f3d;
        "
      >
        <strong>Operação Rolê</strong><br />
        Não conseguimos abrir o app neste navegador. Atualize o navegador (Chrome, Safari 16.4 ou
        superior, Firefox ou Edge) e confirme que o JavaScript está ligado.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
